[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Triton-Kernels"
version = "1.0.0"
description = "Practising and benchmarking different Triton Kernels"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = { text = "MIT" }

authors = [
    { name = "Muppalla Komal", email = "muppallakomaliitkgp2022@gmail.com" }
]

dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pytest>=8.0", 
    "wandb==0.17.7",
    "tqdm>=4.66",
    "triton-windows"
    
]